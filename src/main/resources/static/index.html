<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT 채용 공고 맞춤 큐레이션</title>
    <style>
        /* 가볍고 깔끔한 다나와 스타일 기본 레이아웃 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 20px auto;
            max-width: 1000px;
            color: #333;
            background-color: #f9f9f9;
        }
        h1 { font-size: 22px; margin-bottom: 15px; }

        /* 수집 버튼 바 */
        .crawl-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #fff;
            padding: 12px 15px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }
        .crawl-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }
        .crawl-btn:disabled { background-color: #ccc; }

        /* 다나와 스타일 필터 박스 */
        .filter-box {
            background: #fff;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .filter-row {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 10px 15px;
        }
        .filter-row:last-child { border-bottom: none; }
        .filter-label {
            width: 130px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
        }
        .filter-options label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 결과 현황 */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* 공고 목록 테이블 */
        .job-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid #ddd;
        }
        .job-table th, .job-table td {
            border-bottom: 1px solid #eee;
            padding: 12px 10px;
            text-align: left;
            font-size: 14px;
        }
        .job-table th {
            background-color: #f1f3f5;
            color: #495057;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 11px;
            border-radius: 3px;
            background: #e9ecef;
            color: #495057;
        }
        .badge-saramin { background: #e7f5ff; color: #1971c2; }
        .badge-work24 { background: #ebfbee; color: #2f9e44; }
        .tag {
            display: inline-block;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 12px;
            margin-right: 3px;
            color: #495057;
        }
        .job-title-link {
            text-decoration: none;
            color: #212529;
            font-weight: 600;
        }
        .job-title-link:hover { text-decoration: underline; color: #007bff; }
    </style>
</head>
<body>

<h1>IT 채용 공고 맞춤 큐레이션 서비스</h1>

<!-- 1. 상단 수집 컨트롤러 -->
<div class="crawl-bar">
    <label for="keywordInput"><strong>수집 키워드:</strong></label>
    <input type="text" id="keywordInput" value="백엔드" style="padding: 6px; border: 1px solid #ccc;">
    <button id="crawlBtn" class="crawl-btn" onclick="startCrawl()">신규 공고 수집하기</button>
    <span id="crawlStatus" style="font-size: 13px; color: #666;"></span>
</div>

<!-- 2. 다나와 스타일 다중 필터 영역 -->
<div class="filter-box">
    <!-- 출처 / 플랫폼 -->
    <div class="filter-row">
        <div class="filter-label">수집 플랫폼</div>
        <div class="filter-options">
            <label><input type="radio" name="platform" value="" checked onchange="filterJobs()"> 전체</label>
            <label><input type="radio" name="platform" value="SARAMIN" onchange="filterJobs()"> 사람인</label>
            <label><input type="radio" name="platform" value="WORK24" onchange="filterJobs()"> 고용24</label>
        </div>
    </div>

    <!-- 기술 스택 -->
    <div class="filter-row">
        <div class="filter-label">기술 스택 (언어)</div>
        <div class="filter-options">
            <label><input type="checkbox" name="stack" value="Java" onchange="filterJobs()"> Java</label>
            <label><input type="checkbox" name="stack" value="Spring" onchange="filterJobs()"> Spring / Spring Boot</label>
            <label><input type="checkbox" name="stack" value="JPA" onchange="filterJobs()"> JPA</label>
            <label><input type="checkbox" name="stack" value="Python" onchange="filterJobs()"> Python</label>
            <label><input type="checkbox" name="stack" value="React" onchange="filterJobs()"> React</label>
            <label><input type="checkbox" name="stack" value="MySQL" onchange="filterJobs()"> MySQL</label>
            <label><input type="checkbox" name="stack" value="Node.js" onchange="filterJobs()"> Node.js</label>
        </div>
    </div>

    <!-- 채용 구분 / 경력 -->
    <div class="filter-row">
        <div class="filter-label">채용 구분</div>
        <div class="filter-options">
            <label><input type="radio" name="career" value="" checked onchange="filterJobs()"> 전체</label>
            <label><input type="radio" name="career" value="신입" onchange="filterJobs()"> 신입</label>
            <label><input type="radio" name="career" value="경력" onchange="filterJobs()"> 경력</label>
            <label><input type="radio" name="career" value="경력무관" onchange="filterJobs()"> 경력무관</label>
        </div>
    </div>
</div>

<!-- 3. 검색 결과 목록 -->
<div class="result-header">
    <span>검색된 공고 목록 (<span id="jobCount">0</span>건)</span>
</div>

<table class="job-table">
    <thead>
    <tr>
        <th style="width: 90px;">플랫폼</th>
        <th style="width: 140px;">회사명</th>
        <th>공고 제목</th>
        <th style="width: 110px;">조건 (경력/지역)</th>
        <th style="width: 220px;">인식된 기술스택</th>
    </tr>
    </thead>
    <tbody id="jobTableBody">
    <tr>
        <td colspan="5" style="text-align: center; color: #888; padding: 30px;">
            '신규 공고 수집하기' 버튼을 눌러 크롤링을 먼저 실행해 보세요.
        </td>
    </tr>
    </tbody>
</table>

<!-- 4. 프론트엔드 연동 자바스크립트 -->
<script>
    // 페이지가 열리면 최초 공고 로딩
    window.addEventListener('DOMContentLoaded', () => {
        filterJobs();
    });

    // 다나와 스타일 조건 필터링 함수
    function filterJobs() {
        // 1. 체크된 플랫폼
        const platformEl = document.querySelector('input[name="platform"]:checked');
        const platform = platformEl ? platformEl.value : '';

        // 2. 체크된 경력
        const careerEl = document.querySelector('input[name="career"]:checked');
        const career = careerEl ? careerEl.value : '';

        // 3. 체크된 기술 스택들 (배열)
        const stackBoxes = document.querySelectorAll('input[name="stack"]:checked');
        const stacks = Array.from(stackBoxes).map(cb => cb.value);

        // 4. 쿼리 파라미터 생성
        const params = new URLSearchParams();
        if (platform) params.append('platform', platform);
        if (career) params.append('career', career);
        if (stacks.length > 0) params.append('stacks', stacks.join(','));

        // 백엔드 검색 API 호출
        fetch(`/api/jobs/search?${params.toString()}`)
            .then(res => res.json())
            .then(data => renderJobList(data))
            .catch(err => console.error("데이터 조회 실패:", err));
    }

    // 공고 목록 렌더링
    function renderJobList(jobs) {
        const tbody = document.getElementById('jobTableBody');
        const countEl = document.getElementById('jobCount');
        countEl.innerText = jobs.length;

        if (jobs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; color:#888;">조건에 맞는 채용 공고가 없습니다.</td></tr>`;
            return;
        }

        tbody.innerHTML = jobs.map(job => {
            // 기술스택 태그 변환
            const tags = job.techStacks
                ? job.techStacks.split(',').map(s => `<span class="tag">${s.trim()}</span>`).join('')
                : '<span style="color:#aaa;">-</span>';

            const badgeClass = job.platform === 'SARAMIN' ? 'badge-saramin' : 'badge-work24';

            return `
                    <tr>
                        <td><span class="badge ${badgeClass}">${job.platform}</span></td>
                        <td><strong>${escapeHtml(job.companyName)}</strong></td>
                        <td>
                            <a class="job-title-link" href="${job.detailUrl}" target="_blank">
                                ${escapeHtml(job.title)}
                            </a>
                        </td>
                        <td>
                            <div>${job.career || '-'}</div>
                            <small style="color: #666;">${job.region || ''}</small>
                        </td>
                        <td>${tags}</td>
                    </tr>
                `;
        }).join('');
    }

    // 크롤링 수동 실행
    function startCrawl() {
        const keyword = document.getElementById('keywordInput').value.trim();
        const btn = document.getElementById('crawlBtn');
        const status = document.getElementById('crawlStatus');

        btn.disabled = true;
        status.innerText = "웹 크롤링 진행 중... (약 2~4초 소요)";

        fetch(`/api/jobs/crawl?keyword=${encodeURIComponent(keyword)}`, { method: 'POST' })
            .then(res => res.text())
            .then(msg => {
                status.innerText = msg;
                btn.disabled = false;
                filterJobs(); // 수집 후 목록 자동 갱신
            })
            .catch(err => {
                status.innerText = "수집 실패: 백엔드 서버를 확인하세요.";
                btn.disabled = false;
            });
    }

    // XSS 방지용 간단 이스케이프
    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>"']/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[m]);
    }
</script>
</body>
</html>
